<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-black text-white font-sans min-h-screen">

    <div class="max-w-7xl mx-auto px-6 py-4">

        <header class="flex flex-col md:flex-row items-center justify-between gap-6 py-4 mb-12">
            
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-zinc-800 rounded flex items-center justify-center overflow-hidden">
                    <img src="" alt="CA Иконка" class="w-full h-full object-contain">
                </div>
                <div class="flex flex-col text-left">
                    <span class="font-black text-lg tracking-tight leading-none">Catalyst</span>
                    <span class="text-xs text-gray-400 tracking-wider">Analytics</span>
                </div>
            </div>

            <nav class="flex flex-wrap justify-center items-center gap-6 text-sm text-gray-400">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">Careers</a>
                <a href="#">Career Details</a>
                <a href="#">Contact</a>
            </nav>

            <div>
                <a href="#" class="bg-blue-600 text-white font-medium text-sm px-6 py-2.5 rounded-lg inline-block">
                    Contact Us
                </a>
            </div>

        </header>

        <main class="flex flex-col md:flex-row items-center justify-between gap-12 mt-4">
            
            <div class="w-full md:w-1/2 text-center md:text-left flex flex-col items-center md:items-start">
                
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight mb-6">
                    Transforming Data <br class="hidden md:inline"> 
                    into <span class="bg-blue-600 text-white px-4 py-1 rounded-xl inline-block mt-2 md:mt-0">Decisions</span>
                </h1>
                
                <p class="text-gray-400 text-base md:text-lg max-w-md mb-8 leading-relaxed">
                    Leverage the power of machine learning and AI to unlock insights and drive business growth
                </p>
                
                <div class="mb-10">
                    <a href="#" class="bg-blue-600 text-white font-semibold text-sm px-8 py-3.5 rounded-xl inline-block">
                        Book a Meeting
                    </a>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex -space-x-3">
                        <div class="w-8 h-8 rounded-full bg-zinc-700 border-2 border-black overflow-hidden">
                            <img src="" alt="User 1" class="w-full h-full object-cover">
                        </div>
                        <div class="w-8 h-8 rounded-full bg-zinc-600 border-2 border-black overflow-hidden">
                            <img src="" alt="User 2" class="w-full h-full object-cover">
                        </div>
                        <div class="w-8 h-8 rounded-full bg-zinc-500 border-2 border-black overflow-hidden">
                            <img src="" alt="User 3" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <p class="text-xs text-gray-400">
                        Over <span class="text-white font-bold">100+</span> clients have worked with us
                    </p>
                </div>

            </div>

            <div class="w-full md:w-1/2 flex justify-center items-center">
                <div class="w-72 h-72 md:w-[450px] md:h-[450px] flex items-center justify-center overflow-hidden">
                    <img src="" alt="3D Robot Catalyst Analytics" class="w-full h-full object-contain">
                </div>
            </div>

        </main>

    </div>

</body>

</html>
